name: Go Build

on:
  push:
    branches: [ "main", "master" ]
  pull_request:
    branches: [ "main", "master" ]

jobs:
  build:
    runs-on: windows-latest
    strategy:
      matrix:
        arch: [ amd64, arm64 ]

    steps:
      - uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.26'
          cache: true

      - name: Install dependencies
        run: go mod download

      - name: Build
        shell: pwsh
        env:
          GOOS: windows
          GOARCH: ${{ matrix.arch }}
        run: go build -v -o maps-agent-${{ matrix.arch }}.exe .

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: maps-agent-binary-${{ matrix.arch }}
          path: maps-agent-${{ matrix.arch }}.exe
