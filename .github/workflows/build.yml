name: Go Build

on:
  push:
    branches: [ "main", "master" ]
  pull_request:
    branches: [ "main", "master" ]

jobs:
  build:
    # Pure Go (no cgo), so Windows binaries are cross-compiled on Linux.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod

      - name: Vet
        run: make vet

      - name: Test
        run: make test

      - name: Build
        env:
          GOOS: windows
          CGO_ENABLED: 0
        run: |
          for arch in amd64 arm64; do
            GOARCH=$arch go build -trimpath -o dist/maps-agent-$arch.exe .
          done

      - uses: actions/upload-artifact@v7
        with:
          name: maps-agent
          path: dist/*.exe
