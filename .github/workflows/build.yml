name: Go Build

on:
  push:
    branches: [ "main", "master" ]
  pull_request:
    branches: [ "main", "master" ]

jobs:
  build:
    runs-on: windows-latest
    strategy:
      matrix:
        include:
          - arch: amd64
            zig_target: x86_64-windows-gnu
          - arch: arm64
            zig_target: aarch64-windows-gnu

    steps:
      - uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.26'
          cache: true

      - name: Install Zig
        shell: pwsh
        run: |
          choco install zig -y --no-progress

      - name: Prepare CGO compiler wrapper
        shell: pwsh
        run: |
          $wrapper = "$env:GITHUB_WORKSPACE\cc.cmd"
          @"
          @echo off
          zig cc -target ${{ matrix.zig_target }} %*
          "@ | Set-Content -Path $wrapper -Encoding ASCII

      - name: Install dependencies
        shell: pwsh
        run: go mod download

      - name: Build
        shell: pwsh
        env:
          GOOS: windows
          GOARCH: ${{ matrix.arch }}
          CGO_ENABLED: 1
          CC: ${{ github.workspace }}\cc.cmd
        run: go build -v -o maps-agent-${{ matrix.arch }}.exe .

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: maps-agent-binary-${{ matrix.arch }}
          path: maps-agent-${{ matrix.arch }}.exe