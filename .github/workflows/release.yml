name: Go Release

on:
  push:
    tags:
      - "v*"

jobs:
  release:
    # Pure Go (no cgo), so Windows binaries are cross-compiled on Linux.
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod

      - name: Test
        run: make test

      - name: Build
        env:
          GOOS: windows
          CGO_ENABLED: 0
        run: |
          for arch in amd64 arm64; do
            GOARCH=$arch go build -trimpath -o dist/maps-agent-$arch.exe .
          done

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v3
        with:
          files: dist/*.exe
